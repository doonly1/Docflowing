knowledge_base:
  default_name: "Knowledge Base"
  default_icon: "📚"
  default_permissions: "user"
  search:
    max_chars: 4000
    max_sources: 5
  memory:
    enabled: true
    memory_limit: 2200
    user_limit: 1375
  session_store:
    enabled: true
    retention_days: 90
    search_limit: 20
  skills:
    enabled: true
    stale_days: 30
    archive_days: 90
  curator:
    enabled: true
    interval_hours: 168
    min_idle_hours: 2

llm:
  enabled: false
  api_key: ""
  base_url: ""
  model: ""
  temperature: 0.7
  max_tokens: 4096
