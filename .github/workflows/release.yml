name: Build & Release

on:
  push:
    tags:
      - 'v*'       # 推送 v1.0.0, v1.1.0 等标签时触发
  workflow_dispatch:  # 也可以手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt && pip install pyinstaller

      - name: 生成 spec 并执行 PyInstaller 打包（单文件模式）
        run: python build-desktop.py --onefile
        env:
          PYTHONIOENCODING: utf-8

      - name: 列出构建产物（用于排错）
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          make_latest: true
