name: Build & Release

on:
  push:
    tags:
      - 'v*'       # 推送 v1.0.0, v1.1.0 等标签时触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装 NSIS（生成安装包）
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: 安装 Python 依赖（锁定版本）
        run: pip install -r requirements-lock.txt pyinstaller
        env:
          PYTHONIOENCODING: utf-8

      - name: 构建 onedir 包并生成 NSIS 安装包
        run: python build-desktop.py --installer
        env:
          PYTHONIOENCODING: utf-8

      - name: 校验安装包产物
        shell: pwsh
        run: |
          $exe = Get-Item dist/Docflowing_Setup.exe -ErrorAction Stop
          Write-Host ("安装包: {0} ({1:N1} MB)" -f $exe.FullName, ($exe.Length / 1MB))

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Docflowing_Setup.exe
          generate_release_notes: true
          make_latest: true
