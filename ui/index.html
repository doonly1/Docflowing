<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="max-age=86400">
    <title>文澜</title>
    <link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e94560'/%3E%3Ctext x='16' y='23' font-size='20' font-family='serif' font-weight='bold' fill='white' text-anchor='middle'%3E文%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f2f2f2;
            height: 100vh;
            display: flex;
            overflow: hidden;
            padding: 0;
            margin: 0;
            border: 1px solid #d0d0d0;
        }


        /* ──────── 全局滚动条美化 ──────── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.10);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.25);
        }

        /* ──────── 全局标题栏（贯穿两端） ──────── */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: #f2f2f2;
            display: flex;
            align-items: center;
            z-index: 300;
            -webkit-app-region: drag;
        }
        .app-header .header-left {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            padding: 0;
            width: 56px;
            justify-content: center;
            -webkit-app-region: no-drag;
        }
        .app-header .header-center {
            display: flex;
            align-items: center;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 0;
            -webkit-app-region: drag;
        }
        .app-header .header-center::-webkit-scrollbar {
            height: 0;
        }
        .app-header .header-right {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            -webkit-app-region: no-drag;
        }

        .container {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        .sidebar {
            width: 56px;
            min-width: 56px;
            height: 100vh;
            position: sticky;
            top: 0;
            padding-top: 40px;
            background: #f2f2f2;
            display: flex;
            flex-direction: column;
            padding: 40px 0 0 0;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 100;
            transition: width 0.2s ease;
        }

        .sidebar-brand {
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #666;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }

        .sidebar-brand:hover {
            background: #e5e5e5;
        }

        .sidebar-section {
            padding: 8px 0 0 0;
        }

        .sidebar-section-title {
            display: none;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 48px;
            font-size: 18px;
            color: #666;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .sidebar-nav-item:hover {
            background: #e5e5e5;
        }

        .sidebar-nav-item.active {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .sidebar-nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: #4f46e5;
            border-radius: 0 2px 2px 0;
        }

        .sidebar-nav-item::after {
            content: attr(data-label);
            position: absolute;
            left: 64px;
            top: 50%;
            transform: translateY(-50%);
            background: #555;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 200;
        }

        .sidebar-nav-item:hover::after {
            opacity: 1;
        }

        .sidebar-spacer {
            flex: 1;
        }

        .sidebar-bottom {
            flex-shrink: 0;
            padding-bottom: 8px;
        }

        .sidebar-popup {
            position: fixed;
            left: 64px;
            bottom: 12px;
            background: #f2f2f2;
            border-radius: 8px;
            padding: 4px 0;
            z-index: 250;
            min-width: 130px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            border: 1px solid #e0e0e0;
        }

        .sidebar-popup-item {
            width: auto !important;
            height: auto !important;
            justify-content: flex-start !important;
            padding: 8px 14px !important;
            font-size: 13px !important;
            gap: 8px;
            border-left: none !important;
            border-radius: 0;
            color: #555 !important;
        }

        .sidebar-popup-item:hover {
            background: #e5e5e5;
            color: #333 !important;
        }

        .sidebar-popup-item::after {
            display: none !important;
        }

        .sidebar-popup-divider {
            height: 1px;
            background: #eee;
            margin: 4px 8px;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            padding-top: 40px;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            scrollbar-gutter: stable;
            padding: 0;
            background: #f2f2f2;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 48px;
                min-width: 48px;
            }
            .sidebar-nav-item {
                width: 48px;
                height: 42px;
                font-size: 16px;
            }
            .main-content {
                padding: 10px;
            }
        }

        /* ──────── 折叠按钮（左上角） ──────── */
        .tab-collapse-btn {
            width: 20px;
            height: 20px;
            border: none !important;
            outline: none !important;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            background: transparent !important;
            border-radius: 0 !important;
            position: relative;
        }
        .tab-collapse-btn::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 3px;
            width: 14px;
            height: 14px;
            border: 1.5px solid #999;
            border-radius: 2px;
            box-sizing: border-box;
            background: linear-gradient(to right, #777 40%, transparent 40%);
        }
        .tab-collapse-btn:hover::before {
            border-color: #777;
        }

        /* ──────── 窗口控制按钮（参考图风格） ──────── */
        .tab-win-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #888;
            font-size: 12px;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }
        .tab-win-btn:hover {
            background: #e5e5e5;
            color: #555;
        }
        .tab-win-close:hover {
            background: #e94560;
            color: #fff;
        }

        /* ──────── 标签样式（参考图风格） ──────── */
        .tab-add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            flex-shrink: 0;
            margin-right: 4px;
            -webkit-app-region: no-drag;
        }
        .tab-add-btn:hover {
            background: #ddd;
            color: #666;
        }
        .tab-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #e8e8e8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            color: #888;
            white-space: nowrap;
            user-select: none;
            min-width: 0;
            flex-shrink: 0;
            margin-right: 4px;
            position: relative;
            -webkit-app-region: no-drag;
        }
        .tab-item:hover {
            background: #ddd;
            color: #555;
        }
        .tab-item.active {
            background: #fff;
            color: #333;
        }
        .tab-item .tab-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            font-size: 12px;
            line-height: 1;
            color: #aaa;
            cursor: pointer;
            transition: background 0.1s;
        }
        .tab-item .tab-close:hover {
            background: rgba(0,0,0,0.1);
            color: #666;
        }
        .tab-item .tab-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .tab-item .tab-icon svg {
            width: 14px;
            height: 14px;
        }

        /* ──────── 侧边栏折叠 ──────── */
        .sidebar-collapsed .sidebar {
            width: 0;
            min-width: 0;
            overflow: hidden;
            border-right: none;
        }
        .sidebar-collapsed .sidebar-brand,
        .sidebar-collapsed .sidebar-section,
        .sidebar-collapsed .sidebar-bottom {
            display: none;
        }
        .sidebar-collapsed .sidebar-popup {
            display: none !important;
        }

        .card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .card h2 {
            color: #2c3e50;
            font-size: 0.95rem;
            margin: 0 0 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #e94560;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #e94560;
        }

        input[type="text"]:hover {
            border-color: #e94560;
        }

        input[type="text"][readonly] {
            background: #f5f5f5;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, #e94560 0%, #c41e3a 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            height: 38px;
            line-height: 1;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .tool-item {
            background: #f8f9fa;
            padding: 10px 8px;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .tool-item:hover {
            border-color: #e94560;
            background: #fff;
        }

        .tool-item.active {
            border-color: #e94560;
            background: #fff5f5;
        }

        .tool-item .icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .tool-item .name {
            font-weight: 500;
            color: #333;
            font-size: 13px;
        }

        .tool-item .desc {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .file-list {
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 5px 0;
        }

        .file-row {
            display: flex;
            gap: 10px;
        }

        .file-tag {
            padding: 4px 10px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            display: block;
            margin-bottom: 4px;
        }

        .file-tag:hover {
            border-color: #e94560;
        }

        .file-tag.selected {
            background: #4a90d9;
            color: white;
        }

        .file-tag:last-child {
            margin-bottom: 0;
        }

        #result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
        }

        #result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .feature-list {
            margin-top: 8px;
            padding-left: 20px;
            color: #666;
            font-size: 13px;
        }

        .feature-list li {
            margin: 2px 0;
        }

        .intro {
            color: #666;
            font-size: 13px;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .output-pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            max-height: 150px;
            min-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        #result.success .output-pre,
        #result.error .output-pre {
            margin-bottom: 10px;
        }

        /* 配置弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.show {
            opacity: 1;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            width: 85%;
            max-width: 620px;
            height: 62vh;
            max-height: 520px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.08);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .modal-header h2 {
            margin: 0;
            color: #1a1a2e;
            font-size: 1.1rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .config-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .config-tab {
            padding: 6px 12px;
            background: #f5f5f5;
            border: none;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .config-tab.active {
            background: #e94560;
            color: white;
            font-weight: bold;
        }

        .config-section {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            border: 1px solid #eee;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .config-section.active {
            display: flex;
            flex-direction: column;
        }

        .config-textarea {
            width: 100%;
            min-height: 280px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.3;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            background: #fdfdfd;
        }

        .config-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        .config-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px;
            background: #e8f4fd;
            border-radius: 4px;
            border-left: 3px solid #2196F3;
            flex-shrink: 0;
        }

        .config-toggle label {
            margin: 0;
            font-weight: bold;
            color: #1a1a2e;
            font-size: 13px;
        }

        .config-info {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
            line-height: 1.3;
        }

        .user-info {
            font-size: 13px;
            color: #5a6a7a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fb-selector-group {
            margin-bottom: 12px;
        }

        .fb-selector-group-title {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #eee;
        }

        .fb-selector-item {
            padding: 5px 8px;
            margin: 2px 0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fb-selector-item:hover {
            border-color: #e94560;
            background: #fff5f5;
        }

        .fb-selector-item.selected {
            border-color: #e94560;
            background: #fff0f3;
        }

        .fb-selector-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f5f5f5;
        }

        .fb-selector-subdirs {
            margin-left: 24px;
            border-left: 2px solid #eee;
            padding-left: 12px;
        }

        .fb-subdir-item {
            padding: 4px 8px;
            margin: 1px 0;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
        }

        .fb-subdir-item:hover {
            background: #f0f2f5;
        }

        .fb-subdir-item.selected {
            background: #fff0f3;
            border-color: #e94560;
        }

        .fb-selector-breadcrumb {
            padding: 8px 12px;
            background: transparent;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .fb-selector-breadcrumb span {
            color: #999;
        }

        .fb-selector-breadcrumb span.active {
            color: #333;
            font-weight: bold;
        }

        .fb-selector-breadcrumb a {
            color: #e94560;
            cursor: pointer;
            text-decoration: none;
        }

        .fb-selector-hint {
            font-size: 11px;
            color: #999;
            padding: 4px 0;
        }

        /* ──────── Toast 轻提示 ──────── */
        .custom-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 13px;
            color: #fff;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
            max-width: 80vw;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .custom-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .custom-toast-info    { background: #4a90d9; }
        .custom-toast-success  { background: #28a745; }
        .custom-toast-error    { background: #dc3545; }
        .custom-toast-warning  { background: #f0ad4e; color: #333; }

        /* ──────── 自定义对话框 ──────── */
        .custom-dialog-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .custom-dialog-overlay.show {
            opacity: 1;
        }
        .custom-dialog {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.08);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }
        .custom-dialog-overlay.show .custom-dialog {
            transform: scale(1);
        }
        .custom-dialog-message {
            font-size: 14px;
            color: #333;
            margin-bottom: 16px;
            line-height: 1.6;
            word-break: break-word;
        }
        .custom-dialog-input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;

    <script>
    // 本地 lib 前缀（npm 包拷贝到 ui/lib/）
    window._LIB_PREFIX = '/lib/';

    window._loadScriptAsync = function(url, fallbackUrl) {
        return new Promise(function(resolve, reject) {
            var attempts = fallbackUrl ? [url, fallbackUrl] : [url];
            tryLoad(0);

            function tryLoad(idx) {
                if (idx >= attempts.length) {
                    reject(new Error('Failed to load ' + url));
                    return;
                }
                var s = document.createElement('script');
                s.src = attempts[idx];
                s.async = true;
                s.onload = resolve;
                s.onerror = function() {
                    if (idx < attempts.length - 1) {
                        console.warn('[DocFlow] 回退加载: ' + attempts[idx + 1]);
                        tryLoad(idx + 1);
                    } else {
                        reject(new Error('Failed to load ' + attempts[idx]));
                    }
                };
                document.head.appendChild(s);
            }
        });
    };

    window._loadStyleAsync = function(url, fallbackUrl) {
        return new Promise(function(resolve) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = url;
            l.onload = resolve;
            l.onerror = function() {
                if (fallbackUrl) {
                    l.href = fallbackUrl;
                } else {
                    resolve();
                }
            };
            document.head.appendChild(l);
        });
    };

    window._ensureQuill = function() {
        if (window._quillPromise) return window._quillPromise;
        if (typeof Quill !== 'undefined') return Promise.resolve();
        window._quillPromise = Promise.all([
            window._loadScriptAsync(
                window._LIB_PREFIX + 'quill/dist/quill.js',
                'https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.min.js'
            ),
            window._loadStyleAsync(
                window._LIB_PREFIX + 'quill/dist/quill.snow.css',
                'https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css'
            )
        ]);
        return window._quillPromise;
    };
    window._ensureMarked = function() {
        if (window._markedPromise) return window._markedPromise;
        if (typeof marked !== 'undefined') return Promise.resolve();
        window._markedPromise = window._loadScriptAsync(
            window._LIB_PREFIX + 'marked/marked.min.js',
            'https://cdn.jsdelivr.net/npm/marked/marked.min.js'
        );
        return window._markedPromise;
    };
    window._ensurePdfJs = function() {
        if (window._pdfJsPromise) return window._pdfJsPromise;
        if (typeof pdfjsLib !== 'undefined') return Promise.resolve();
        window._pdfJsPromise = window._loadScriptAsync(
            '/js/lib/pdf.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'
        );
        return window._pdfJsPromise;
    };
    window._renderPdfInContainer = async function(fileUrl, contentEl) {
        try {
            contentEl.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">正在加载PDF...</div>';
            await window._ensurePdfJs();
            pdfjsLib.GlobalWorkerOptions.workerSrc = '/js/lib/pdf.worker.min.js';

            var resp = await fetch(fileUrl);
            if (!resp.ok) throw new Error('获取PDF失败 (HTTP ' + resp.status + ')');
            var arrayBuffer = await resp.arrayBuffer();
            var pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            var totalPages = pdfDoc.numPages;
            var currentPage = 1;

            contentEl.innerHTML =
                '<div class="pdf-viewer-wrap" style="display:flex;flex-direction:column;height:100%;">' +
                '  <div class="pdf-viewer-pages" style="flex:1;overflow:auto;text-align:center;padding:16px;background:#e8e8e8;display:flex;flex-direction:column;align-items:center;"></div>' +
                '  <div class="pdf-viewer-bar" style="display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 12px;background:#f8f9fa;border-top:1px solid #ddd;flex-shrink:0;">' +
                '    <button class="pdf-btn" data-page="prev" style="padding:4px 14px;cursor:pointer;border:1px solid #bbb;border-radius:4px;background:#fff;font-size:13px;color:#333;">&larr; 上一页</button>' +
                '    <span class="pdf-page-info" style="font-size:13px;color:#555;user-select:none;">1 / ' + totalPages + '</span>' +
                '    <button class="pdf-btn" data-page="next" style="padding:4px 14px;cursor:pointer;border:1px solid #bbb;border-radius:4px;background:#fff;font-size:13px;color:#333;">下一页 &rarr;</button>' +
                '  </div>' +
                '</div>';

            var pagesEl = contentEl.querySelector('.pdf-viewer-pages');
            var infoEl = contentEl.querySelector('.pdf-page-info');

            function renderPage(num) {
                return pdfDoc.getPage(num).then(function(page) {
                    var viewport = page.getViewport({ scale: 1.5 });
                    var canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.style.maxWidth = '100%';
                    canvas.style.height = 'auto';
                    canvas.style.boxShadow = '0 2px 12px rgba(0,0,0,0.15)';
                    canvas.style.background = '#fff';
                    canvas.style.borderRadius = '2px';
                    pagesEl.innerHTML = '';
                    pagesEl.appendChild(canvas);
                    return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                });
            }

            renderPage(1);

            contentEl.querySelector('.pdf-btn[data-page="prev"]').addEventListener('click', function() {
                if (currentPage > 1) { currentPage--; infoEl.textContent = currentPage + ' / ' + totalPages; renderPage(currentPage); }
            });
            contentEl.querySelector('.pdf-btn[data-page="next"]').addEventListener('click', function() {
                if (currentPage < totalPages) { currentPage++; infoEl.textContent = currentPage + ' / ' + totalPages; renderPage(currentPage); }
            });
        } catch (e) {
            contentEl.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">PDF加载失败: ' + (e.message || '未知错误') + '</div>';
        }
    };
    window._ensureTurndown = function() {
        if (window._turndownPromise) return window._turndownPromise;
        if (typeof TurndownService !== 'undefined') return Promise.resolve();
        window._turndownPromise = window._loadScriptAsync(
            window._LIB_PREFIX + 'turndown/dist/turndown.js',
            'https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.min.js'
        );
        return window._turndownPromise;
    };
    </script>
