version: '3.8'

services:
  docproc:
    build: .
    container_name: docproc
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - LOG_LEVEL=INFO
      - DOCPROC_ADMIN=${DOCPROC_ADMIN:-}
    volumes:
      - docproc_workspaces:/app/workspaces
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  docproc_workspaces:
  kb_storage:
